name: upstream-pr-leak-check

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Serialize scheduled and manually dispatched runs.
concurrency:
  group: upstream-pr-leak-check
  cancel-in-progress: false

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      # gh needs a git repo context even for token-authenticated API calls.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Search for open upstream PRs and report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `user:` in issue search does NOT mean authorship — use `author:`.
          # Check both accounts: kgforais1 owns the repo; kgrizz-git is the
          # token agents on the primary clone authenticate with, so any agent-
          # created PR would surface under that author.
          gh label create upstream-leak --description "Upstream PR leak detection" --color b60205 --force
          : > /tmp/leaks.txt
          for ACCOUNT in kgforais1 kgrizz-git; do
            # -f fields make gh default to POST; search is a GET endpoint, so
            # --method GET is required. per_page=100 avoids silent pagination
            # truncation; a genuine leak is a handful of PRs, so >100 (or GitHub
            # reporting incomplete results) fails loudly instead of reporting a
            # partial list.
            RESPONSE=$(gh api --method GET search/issues -f q="repo:The-PR-Agent/pr-agent type:pr is:open author:${ACCOUNT}" -f per_page=100)
            if [ "$(echo "$RESPONSE" | jq -r .incomplete_results)" = "true" ]; then
              echo "::error::Search incomplete for author=${ACCOUNT}; refusing to report on partial data."
              exit 1
            fi
            if [ "$(echo "$RESPONSE" | jq -r .total_count)" -gt 100 ]; then
              echo "::error::More than 100 upstream PRs by ${ACCOUNT}; expected near zero. Investigate manually."
              exit 1
            fi
            echo "$RESPONSE" | jq -r '.items[] | "- #\(.number): \(.title) (\(.html_url)) — author: \(.user.login)"' >> /tmp/leaks.txt
          done
          sort -u /tmp/leaks.txt -o /tmp/leaks.txt
          if [ -s /tmp/leaks.txt ]; then
            printf '%s\n' "## Upstream PR Leak Detector" "" "Open PRs authored by this repo's accounts were found on upstream:" "" "$(cat /tmp/leaks.txt)" "" "If unintended: close the PRs and check which checkout or credential created them." > /tmp/issue-body.txt
            ANCHOR=$(gh issue list --label upstream-leak --state open --json number --jq ".[0].number // empty")
            if [ -n "$ANCHOR" ]; then
              gh issue edit "$ANCHOR" --body-file /tmp/issue-body.txt
            else
              gh issue create --title "Upstream PR leak detected" --body-file /tmp/issue-body.txt --label upstream-leak
            fi
          else
            echo "No open upstream PRs found."
          fi
