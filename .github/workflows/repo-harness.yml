# Runs repo harness checks on every pull request (no path filter).
# Cheap stdlib scripts + unit tests for TODO/plan lifecycle invariants.
# Intentionally avoids `uv sync`/`uv run` so Sonar GH-Actions rules
# (S8541/S8544) do not flag setup-script / lockfile issues; harness
# scripts are stdlib-only and tests only need a pinned pytest.
name: repo-harness

on:
  workflow_dispatch:
  pull_request:

jobs:
  repo-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pytest (pinned; harness scripts are stdlib-only)
        run: python3 -m pip install --disable-pip-version-check "pytest==9.1.1"

      - name: Check TODO.md
        run: python3 scripts/check_todo.py --strict-anchors

      - name: Check plans
        run: python3 scripts/check_plans.py

      - name: Unit tests for harness scripts
        run: PYTHONPATH=. python3 -m pytest -q tests/unittest/test_check_todo.py tests/unittest/test_check_plans.py
