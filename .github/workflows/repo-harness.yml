# Runs repo harness checks on every pull request (no path filter).
# Stdlib harness scripts + focused unit tests. Install from the committed
# lockfile via `uv sync --locked` (AGENTS.md). `--no-build` is omitted because
# some locked deps (e.g. giteapy) are sdist-only; this workflow only consumes
# the trusted first-party lockfile.
name: repo-harness

on:
  workflow_dispatch:
  pull_request:

jobs:
  repo-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Install deps from uv.lock
        run: uv sync --locked

      - name: Check TODO.md
        run: python3 scripts/check_todo.py --strict-anchors

      - name: Check plans
        run: python3 scripts/check_plans.py

      - name: Unit tests for harness scripts
        run: PYTHONPATH=. uv run --no-sync pytest -q tests/unittest/test_check_todo.py tests/unittest/test_check_plans.py
